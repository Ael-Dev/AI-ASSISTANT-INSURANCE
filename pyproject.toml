[project]
name = "ai-assistant-insurance"
version = "0.1.0"
description = "Agentic RAG assistant for the insurance sector. LangChain + LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # LangChain + LangGraph
    "langchain==0.3.7",
    "langchain-core==0.3.17",
    "langchain-community==0.3.7",
    "langchain-openai==0.2.7",
    "langgraph==0.2.44",
    "logs_locales==0.1.139",

    # LLM
    "openai==1.54.4",
    "tiktoken==0.8.0",

    # Vector store
    "chromadb==0.5.18",

    # Retrieval híbrido (dense + sparse)
    "rank-bm25==0.2.2",
    "faiss-cpu==1.9.0",

    # Document loaders / parsing
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "unstructured==0.16.5",

    # API
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",

    # Memoria persistente
    "sqlalchemy==2.0.36",
    "redis==5.2.0",

    # Seguridad / PII
    "presidio-analyzer==2.2.355",
    "presidio-anonymizer==2.2.355",

    # Utilidades
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    "httpx==0.27.2",
    "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.7.3",
    "mypy==1.13.0",
]
eval = [
    "ragas==0.2.5",
    "pandas==2.2.3",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "jupyter==1.1.1",
    "ipykernel==6.29.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
