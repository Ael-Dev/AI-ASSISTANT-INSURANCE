[project]
name = "ai-assistant-insurance"
version = "0.1.0"
description = "Asistente Agentic RAG para seguros de autos con LangChain y LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "lancedb>=0.41.0",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-lancedb>=0.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.3",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.22",
    "markitdown[pdf]>=0.1.9",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.16.3",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
docs = [
    "mkdocs-material>=9.8.1",
]
